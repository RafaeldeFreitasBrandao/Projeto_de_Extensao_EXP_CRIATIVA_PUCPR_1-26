<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalhes do Usuário</title>
        <link rel="stylesheet" href="../../css/base.css">
        <link rel="stylesheet" href="../../css/components.css">
        <link rel="stylesheet" href="../../css/pacient_dt_lyt.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
<body>
    <div class="big_content">

        <div class="main_content">

            <div class="header_main">

                <h1><i class="fa-solid fa-user-doctor" style="color: rgb(252, 252, 252);"></i>Usuário de Saúde</h1>
            
            </div>

            <div class="very_big_content">

                <div class="detail_content" id="un_content">

                    <h3><i class="fa-solid fa-user" style="color: rgb(0, 0, 0);"></i> Nome:</h3>
                        <input type="text" placeholder="Nome" id="nome">

                    <h3><i class="fa-solid fa-id-badge" style="color: rgb(0, 0, 0);"></i> CPF:</h3>
                        <input type="number" id="cpf" placeholder="CPF" 
                        oninput="if(this.value.length > 11) this.value = this.value.slice(0, 11);">

                    <h3><i class="fa-solid fa-envelope" style="color: rgb(0, 0,0);"></i> Email</h3>
                        <input type="text" id="email" placeholder="Email">
                    
                    <h3><i class="fa-solid fa-phone" style="color: rgb(0, 0, 0);"></i>Telefone</h3>
                        <input type="number" id="telefone" placeholder="(00) 00000-0000" 
                        oninput="if(this.value.length > 12) this.value = this.value.slice(0, 12);">
                    
                    <h3><i class="fa-solid fa-user-doctor" style="color: rgb(0, 0, 0);"></i>Profissão</h3>
                        <input type="text" id="profissao" placeholder="Sua Profissão">

                    <h3><i class="fa-solid fa-hospital" style="color: rgb(0, 0, 0);"></i> Unidade de Saúde</h3>
                        <input type="text" id="unidade" placeholder="Sua Unidade">
    
                </div>



                <div class="detail_content" id="second_detail_content">

                    <button id="edit_button">Editar</button>
                    <button id="delete_button">Excluir</button>
                    <a href="users_admin.html"><button>Voltar</button></a>
                    <p id="msg"></p>
                    
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/users_dt.js"></script>
</body>
</html>
