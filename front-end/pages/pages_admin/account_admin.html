<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/account_admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Conta Administrador</title>
</head>

<body>

    <div class="big_content">

        <div class="accnt_container">

            <div class="header_content">
                <h1>
                    <i class="fa-solid fa-user-shield"></i>
                    Painel Administrativo
                </h1>
            </div>

            <div class="main_content">

                <div class="data_container" id="nav_box">
                    <h3><i class="fa-solid fa-compass"></i> Navegação</h3>

                    <div class="nav_links">
                        <a href="dashboard_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-chart-line"></i>
                                Dashboard
                            </button>
                        </a>

                        <a href="form_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-file-lines"></i>
                                Formulários
                            </button>
                        </a>

                        <a href="guardians_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-people-roof"></i>
                                Responsáveis
                            </button>
                        </a>

                        <a href="pacients_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-hospital-user"></i>
                                Pacientes
                            </button>
                        </a>

                        <a href="report_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-chart-pie"></i>
                                Relatórios
                            </button>
                        </a>

                        <a href="users_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-users"></i>
                                Usuários
                            </button>
                        </a>
                    </div>
                </div>

                <div class="data_container">
                    <h3><i class="fa-solid fa-chart-bar"></i> Resumo Geral</h3>

                    <h3 class="field_label"><i class="fa-solid fa-clipboard-list"></i> Formulários Respondidos:</h3>
                    <input type="text" value="" readonly placeholder="—">

                    <h3 class="field_label"><i class="fa-solid fa-hospital-user"></i> Pacientes Cadastrados:</h3>
                    <input type="text" value="" readonly placeholder="—">

                    <h3 class="field_label"><i class="fa-solid fa-people-roof"></i> Responsáveis:</h3>
                    <input type="text" value="" readonly placeholder="—">

                    <h3 class="field_label"><i class="fa-solid fa-users"></i> Usuários do Sistema:</h3>
                    <input type="text" value="" readonly placeholder="—">

                    <h3 class="field_label"><i class="fa-solid fa-percent"></i> Taxa de Resposta:</h3>
                    <input type="text" value="" readonly placeholder="—">
                </div>

                <div class="data_container">
                    <h3><i class="fa-solid fa-clock-rotate-left"></i> Últimos Formulários</h3>

                    <div class="empty_state">
                        <i class="fa-regular fa-folder-open"></i>
                        <p>Nenhum formulário recente.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
