<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/account_admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Conta Administrador</title>
</head>

<body>

    <!-- Toast de erro — fora do painel principal -->
    <div id="toast-erro">
        <i class="fa-solid fa-circle-exclamation toast-icon"></i>
        <div class="toast-body">
            <strong>Erro</strong>
            <span id="toast-msg"></span>
        </div>
        <button id="toast-fechar" title="Fechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="big_content">

        <div class="accnt_container">

            <div class="header_content">
                <h1>
                    <i class="fa-solid fa-user-shield"></i>
                    Painel Administrativo
                </h1>
            </div>

            <div class="main_content">

                <!-- Coluna 1: Navegação -->
                <div class="data_container" id="nav_box">
                    <h3><i class="fa-solid fa-compass"></i> Navegação</h3>

                    <div class="nav_links">
                        <a href="dashboard_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-chart-line"></i>
                                Dashboard
                            </button>
                        </a>

                        <a href="form_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-file-lines"></i>
                                Formulários
                            </button>
                        </a>

                        <a href="guardians_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-people-roof"></i>
                                Responsáveis
                            </button>
                        </a>

                        <a href="pacients_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-hospital-user"></i>
                                Pacientes
                            </button>
                        </a>

                        <a href="report_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-chart-pie"></i>
                                Relatórios
                            </button>
                        </a>

                        <a href="users_admin.html">
                            <button class="nav_btn">
                                <i class="fa-solid fa-users"></i>
                                Usuários
                            </button>
                        </a>
                    </div>
                </div>

                <!-- Coluna 2: Dados da Conta -->
                <div class="data_container">
                    <h3><i class="fa-solid fa-user-gear"></i> Minha Conta</h3>

                    <h3 class="field_label">
                        <i class="fa-solid fa-user"></i> Nome de Usuário:
                    </h3>
                    <input type="text" id="nome_usuario" placeholder="Nome de usuário">

                    <h3 class="field_label">
                        <i class="fa-solid fa-lock"></i> Senha:
                    </h3>
                    <input type="password" id="senha" placeholder="Senha">

                    <div class="button_box">
                        <button id="edit-button" class="nav_btn">
                            <i class="fa-solid fa-pen"></i>
                            Editar
                        </button>
                        <p id="msg-info"></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="../../js/account_admin.js"></script>

</body>

</html>
