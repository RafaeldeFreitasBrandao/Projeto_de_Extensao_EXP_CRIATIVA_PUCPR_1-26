<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/dashboard_lyt.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

    <div class="dash_head">
        <img src="../../data/logo.png" alt="Logo">
        <h1>Painel Principal</h1>

        <a href="account_user.html" id="user_a" title="Minha Conta">
            <i class="fa-regular fa-circle-user fa-3x"></i>
        </a>

        <a href="../login.html" title="Sair">
            <i class="fa-solid fa-person-walking-arrow-right fa-3x"></i>
        </a>

    <div class="dash_bemvindo">

        <p>Selecione uma opção abaixo para continuar.</p>
    </div>

    <div class="dash_main">
        <nav>
            <a href="pacients_user.html" title="Gerenciar Pacientes">
                <i class="fa-solid fa-user-plus"></i>
                <span>Paciente</span>
            </a>

            <a href="guardian_user.html" title="Gerenciar Responsáveis">
                <i class="fa-solid fa-user-shield"></i>
                <span>Responsável</span>
            </a>

            <a href="forms_user.html" title="Preencher Formulários">
                <i class="fa-solid fa-clipboard-list"></i>

            </a>

            <a href="report_user.html" title="Ver Resultados">
